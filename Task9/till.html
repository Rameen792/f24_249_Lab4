<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Shop — Till</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Uniform Shop</h1>
        <p>Task 9 — Who is in</p>
        <nav>
            <a href="index.html">Sheet</a>
            <a href="till.html">Till</a>
            <a href="who.html">Who is in</a>
        </nav>
    </header>

    <main>
        <h2>Customer Till</h2>
        <p>Enter the bill and the amount the customer paid.</p>

        <form id="tillForm">
            <label>
                Bill
                <input id="bill" type="number" step="any" placeholder="e.g. 100">
            </label>

            <label>
                Paid
                <input id="paid" type="number" step="any" placeholder="e.g. 150">
            </label>

            <button type="submit">Take</button>
        </form>

        <section class="result-box" id="result" aria-live="polite">
            Your result will appear here.
        </section>

        <footer>Roll Number: 249</footer>
    </main>
    <script src="till.js"></script>
</body>
</html>
