<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Shop — Task 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Uniform Shop</h1>
        <p>Task 1 — The Sheet</p>
    </header>

    <main>
        <h2>Stock Sheet</h2>
        <p>Add items to the shop sheet and view their line totals.</p>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Line</th>
                    <th>Note</th>
                </tr>
            </thead>
            <tbody id="sheetRows">
                <tr>
                    <td colspan="5">No items added yet.</td>
                </tr>
            </tbody>
        </table>

        <footer>Roll Number: 249</footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
